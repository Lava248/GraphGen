<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GraphGen Admin Panel</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="admin-navbar">

        <div class="logo">
            GraphGen <span>Admin</span>
        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </nav>


    <!-- Main Container -->
    <main class="admin-container">

        <h1>Admin Dashboard</h1>

        <p class="subtitle">
            Manage GraphGen users and graphs
        </p>


        <!-- Statistics -->
        <section class="stats-container">

            <div class="stat-card">
                <h3>Total Users</h3>
                <p id="totalUsers">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Graphs</h3>
                <p id="totalGraphs">0</p>
            </div>

        </section>


        <!-- Users Section -->
        <section class="admin-section">

            <h2>Users</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="usersTableBody">
                    </tbody>

                </table>

            </div>

        </section>


        <!-- Graphs Section -->
        <section class="admin-section">

            <h2>All Graphs</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Graph Type</th>
                            <th>User</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="graphsTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/admin.js"></script>

</body>

</html>
